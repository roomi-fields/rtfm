[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biblirag"
version = "0.1.0"
description = "Local document library with semantic search - like NotebookLM but local and extensible"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "roomi-fields" }
]
keywords = ["rag", "search", "documents", "library", "fts5", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
]

dependencies = []

[project.optional-dependencies]
pdf = [
    "pdftext>=0.3.0",
    "marker-pdf>=0.2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
biblirag = "biblirag.cli:main"

[project.urls]
Homepage = "https://github.com/roomi-fields/biblirag"
Repository = "https://github.com/roomi-fields/biblirag"
Issues = "https://github.com/roomi-fields/biblirag/issues"

[tool.hatch.build.targets.wheel]
packages = ["biblirag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
