[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtfm"
version = "0.1.0"
description = "Read The Fucking Manual — Project intelligence for AI coding agents. Indexes code, docs, specs, and data. Serves surgical context via MCP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "roomi-fields" }
]
keywords = [
    "mcp", "claude-code", "project-intelligence", "context", "rag",
    "search", "indexing", "fts5", "sqlite", "embeddings",
    "ai-agent", "knowledge-base", "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Indexing",
]

dependencies = []

[project.optional-dependencies]
pdf = [
    "pdftext>=0.3.0",
    "marker-pdf>=0.2.0",
]
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
rtfm = "rtfm.cli:main"

[project.urls]
Homepage = "https://github.com/roomi-fields/rtfm"
Repository = "https://github.com/roomi-fields/rtfm"
Issues = "https://github.com/roomi-fields/rtfm/issues"

[tool.hatch.build.targets.wheel]
packages = ["rtfm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
