name: Publish to the MCP Registry

# The registry is what directories and agents read to learn about a server,
# and it sat at 0.8.0 for forty-seven releases: publishing it was a manual
# step with a login token that expired. It now follows every PyPI release,
# authenticated by GitHub's OIDC identity, so there is no token to expire.

on:
  workflow_run:
    workflows: ["Release to PyPI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      - name: Publish server.json
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
