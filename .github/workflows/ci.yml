name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests (skip network)
        run: pytest -q -m 'not network'

  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check version mirrors are in sync with pyproject.toml
        run: python scripts/sync_version.py --check

  lint:
    runs-on: ubuntu-latest
    # Non-blocking: ~83 pre-existing ruff violations (see pyproject [tool.ruff]).
    # Surfaces the backlog without gating merges. Drop this once `ruff check
    # rtfm/` is clean, to make lint a hard gate per PLAYBOOK §1.7.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check rtfm/
